<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <style>
      .thin {
        stroke: #111;
        stroke-width: 3;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .heavy {
        fill: #111;
      }
    </style>
  </defs>

  <!-- BACK A (raised + closer) -->
  <g transform="translate(-78, -30)"> <!-- 👈 raised here -->
    
    <!-- thin left leg -->
    <line x1="300" y1="320" x2="380" y2="90" class="thin"/>

    <!-- heavy right leg -->
    <polygon class="heavy"
      points="
        380,90
        415,90
        500,320
        460,320
      "
    />

    <!-- crossbar -->
    <line x1="336" y1="215" x2="444" y2="215" class="thin"/>

    <!-- shorter base -->
    <line x1="286" y1="320" x2="330" y2="320" class="thin"/>

  </g>

  <!-- FRONT A -->

  <!-- thin left leg -->
  <line x1="140" y1="320" x2="220" y2="80" class="thin"/>

  <!-- heavy right leg -->
  <polygon class="heavy"
    points="
      220,80
      255,80
      335,320
      295,320
    "
  />

  <!-- crossbar -->
  <line x1="176" y1="210" x2="284" y2="210" class="thin"/>

  <!-- shorter base -->
  <line x1="126" y1="320" x2="170" y2="320" class="thin"/>

</svg>